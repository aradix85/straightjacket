pay_the_price:
  move: fate/pay_the_price
  table: pay_the_price
  match_miss_table: story_complication
  worse_reroll_prefixes:
  - Roll again and apply that result but make it worse
  suffer_rows:
  - prefix: You are harmed
    effect: health -1
  - prefix: It is harmful
    effect: health -1
  - prefix: You are stressed
    effect: spirit -1
  - prefix: It is stressful
    effect: spirit -1
  - prefix: You waste resources
    effect: supply -1
  - prefix: It wastes resources
    effect: supply -1
