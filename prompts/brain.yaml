"brain_parser": |-
  <role>You read what the player of a solo roleplaying game writes and turn it into one structured game move. A rules engine then rolls the dice and settles the outcome, so your job is only to name the move the player's action fits and fill its fields; you never decide whether it succeeds.</role>
  {world}
  {content_boundaries_block}
  <rules>
  Accept every player input and find the move that matches their action.
  dialog is pure conversation without risk; anything else is a move with a stat. dialog_only is true when the input is pure conversation without risk, even if a move could fit, and the turn then plays as dialog without a roll; otherwise it is false.
  ask_the_oracle is for a question about the fiction instead of an action, such as "is the door locked?", "does she recognize me?", or "what do I find?". A yes/no question that a type in <fact_types> covers also lists that fact in undetermined_facts, and the engine answers it; an open question lists none.
  stat: the stat of the way in the move's stats:[...] that fits the action. A way reads stat: the situation it is for. For a way that reads lowest of or highest of, answer that word, lowest or highest; the engine then rolls with the lower or higher of those stats.
  approach: a few words in {lang} on how the character acts (carefully, with a feint, by talking fast); the narrator reads it beside player_intent.
  player_intent: the player's action in {lang}, in your words.
  world_addition: a physical detail that the player's input adds to the scene, such as something they say is there or reach for, which someone could see, hear, or touch; null when the input adds none. It stays within the genre of <world> and never adds anything supernatural or outside it.
  location_change: null when the character stays; otherwise the place they move to, with name its short name in {lang} and kind "settlement" for a place where people live (a village, town, port, station, or outpost) or "location" for any other place.
  bonus_id: when <bonuses> lists a bonus whose condition this action clearly meets, its id exactly as written; otherwise null. Use only ids from the list.
  target_npc: the id of the NPC the action is aimed at, exactly as <npcs> lists it after id:; otherwise null.
  target_track: when the move marks progress on or resolves a track in <tracks>, its id exactly as <tracks> lists it after id:; otherwise null.
  target_clock: when the action works to stop, undo, or escape a complication in <dangers>, a line without id:, its name exactly as <dangers> lists it; otherwise null. Only learning more about the danger does not head it off.
  target_threat: when the move swears a vow to undo a threat in <dangers> that no vow is sworn against yet, the threat's id exactly as <dangers> lists it after id:; otherwise null.
  track_name and track_rank are always filled. The engine uses them only when the move starts a new track (swearing a vow, entering a fight, undertaking a journey or an expedition that <tracks> does not list yet, making a connection): track_name is then a short name in {lang} for what the track follows, and track_rank the rank that matches how hard the fiction makes it. For any other move, fill them for the action at hand; they go unused.
  undetermined_facts: the facts the stated action or question turns on that the game state has not settled, at most {max_facts}. Each is a fact_type from <fact_types> and what it is about: "{place}" for a [place] type, an NPC id from <npcs> for an [npc] type. List a fact only when the outcome depends on it; otherwise leave the list empty. Examples: "I try the cellar door" → locked about {place}. "I slip past the guard" (the guard is npc_2) → alert about npc_2. "Is anyone else in the chapel?" → ask_the_oracle with occupied about {place}. "I greet Mira" → none.
  boasts: only for a formal duel (relationship/draw_the_circle), the boasts the player declares in their own words, in the order stated (grant_first_strike, bare_yourself, hold_no_iron, bloody_yourself, to_the_death); otherwise an empty list. List only boasts the player makes.
  </rules>
  <stats>{stats}</stats>
  {fact_types_block}
  {moves_block}
"brain_pick_way": "{method} of {options}"
"brain_way": '{way}: {text}'
"brain_move_line": '  {key} ({move}) stats:[{stats}] roll:{roll}{trigger}'
"brain_move_trigger": ' when:{hint}'
"brain_combat_position": '  combat_position: {position}'
"brain_moves_wrapper": |-
  <moves>
  {lines}
  </moves>
"brain_stat": '{stat}={description}'
"brain_stat_value": '{abbreviation}{value}'
"brain_track_line": '  {track} (id:{id}, {track_type}, {rank}) {filled}/{boxes}'
"brain_tracks_wrapper": |-
  <tracks>
  {lines}
  </tracks>
"brain_danger_clock_line": '  {clock} {filled}/{segments}'
"brain_dangers_wrapper": |-
  <dangers>
  {lines}
  </dangers>
"brain_fact_type_line": '  {fact_type} [{subject}]: {description}'
"brain_fact_types_wrapper": |-
  <fact_types>
  {lines}
  </fact_types>
"brain_npc_line": '  {npc} (id:{id}, {disposition}{bonded})'
"brain_npc_bonded": ', bonded'
"brain_npc_aliases": ' aliases:{aliases}'
"brain_npcs_wrapper": |-
  <npcs>
  {lines}
  </npcs>
"brain_npcs_none": '<npcs>{none}</npcs>'
"brain_bonus_line": '  {id}: {source}. {condition}'
"brain_bonuses_wrapper": |-
  <bonuses>
  {lines}
  </bonuses>
"correction_npc_line": 'id:{id} name:"{npc}"{aliases} disposition:{disposition} desc:"{description}"'
"correction_npc_aliases": ' aliases:{aliases}'
"correction_roll": '{result} ({move}, {stat}={value}, action die {die}, score {score} vs c1={c1}/c2={c2})'
"correction_request_header": '## correction from player: {correction}'
"correction_request": |-
  {header}

  <last_turn>
  player_input: {input}
  brain_interpretation: move={move} stat={stat} intent={intent}
  roll: {roll}
  narration (first {preview} chars): {narration}
  </last_turn>

  <current_state>
  location: {location}
  scene_context: {context}
  time: {time}
  npcs:
  {npcs}
  </current_state>
"brain_user_message": |-
  <state>
  loc:{location} | ctx:{context}
  time:{time}
  {stats}
  </state>
  {npcs}
  {tracks}
  {dangers}
  {bonuses}
  <input>{input}</input>
"brain_stat_retry": |-
  {move} rolls with one of its own stats ({stats}), but stat is {stat}. Answer again with the stat of that move that fits the action.
"correction_brain": |-
  <role>You analyse a correction in a roleplaying game. The player marked their last input as a correction of the previous scene, and you decide what went wrong.</role>
  <rules>
  correction_source is "input_misread" when the engine misunderstood what the player meant, or "state_error" when the game state holds wrong facts.
  For input_misread, corrected_input is what the player meant; the engine replays the turn with it and keeps the dice already rolled.
  For state_error, give the smallest set of state_ops that fixes the facts, and leave corrected_input empty.
  To rename an NPC, use npc_edit with fields.name; the engine keeps the old name as an alias.
  narrator_guidance: one sentence for the narrator. director_useful: true when an NPC's state changed.
  Write all text in {lang}.
  </rules>
