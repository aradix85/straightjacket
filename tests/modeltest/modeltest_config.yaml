attempts: 3
workers: 10
max_retries: 2
narration_max_tokens: 6000
judge_max_tokens: 3000
seed_limit: 400
narration_lang: "English"
baseline: "baseline_luna_gemini_sol.json"

providers:
  fireworks:
    type: "openai_compatible"
    api_base: "https://api.fireworks.ai/inference/v1"
    api_key_env: "FIREWORKS_API_KEY"
    timeout_seconds: 120
  openrouter:
    type: "openai_compatible"
    api_base: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    timeout_seconds: 120

judges:
- label: "GPT-6 Sol"
  provider: "openai"
  model: "gpt-6-sol"
  extra_body:
    reasoning_effort: "low"

contestants:
  gpt-6-luna:
    label: "GPT-6 Luna"
    provider: "openai"
    model: "gpt-6-luna"
    extra_body:
      reasoning_effort: "none"
  claude-sonnet-5:
    label: "Claude Sonnet 5"
    provider: "anthropic"
    model: "claude-sonnet-5"
    extra_body: {}
  claude-opus-5-5:
    label: "Claude Opus 5.5"
    provider: "anthropic"
    model: "claude-opus-5-5"
    extra_body:
      output_config:
        effort: "low"
  claude-haiku-4-5:
    label: "Claude Haiku 4.5"
    provider: "anthropic"
    model: "claude-haiku-4-5-20251001"
    extra_body: {}

  glm-5.3:
    label: "GLM 5.3"
    provider: "openrouter"
    model: "z-ai/glm-5.3"
    extra_body:
      reasoning:
        effort: "low"
      provider:
        data_collection: "deny"
  muse-spark-1.3:
    label: "Muse Spark 1.3 Contributor"
    provider: "openrouter"
    model: "meta/muse-spark-1.3-contributor"
    extra_body:
      reasoning:
        effort: "low"
  qwen3.8-flash:
    label: "Qwen3.8 Flash"
    provider: "openrouter"
    model: "qwen/qwen3.8-flash"
    extra_body:
      reasoning:
        effort: "low"
      provider:
        data_collection: "deny"
  kimi-k3:
    label: "Kimi K3"
    provider: "openrouter"
    model: "moonshotai/kimi-k3"
    extra_body:
      reasoning:
        effort: "low"
      provider:
        data_collection: "deny"
  gemini-3.8-flash:
    label: "Gemini 3.8 Flash"
    provider: "openrouter"
    model: "google/gemini-3.8-flash"
    extra_body:
      reasoning:
        effort: "minimal"
      provider:
        sort: "latency"
        data_collection: "deny"

  muse-spark-1.3-standard:
    label: "Muse Spark 1.3 (standard)"
    provider: "openrouter"
    model: "meta/muse-spark-1.3"
    extra_body:
      reasoning:
        effort: "minimal"
      provider:
        data_collection: "deny"

  qwen3.8-flash-nothink:
    label: "Qwen3.8 Flash (no thinking)"
    provider: "openrouter"
    model: "qwen/qwen3.8-flash"
    extra_body:
      reasoning:
        enabled: false
      provider:
        data_collection: "deny"

  glm-5.3-fw:
    label: "GLM 5.3 (Fireworks)"
    provider: "fireworks"
    model: "accounts/fireworks/models/glm-5p3"
    extra_body:
      reasoning_effort: "low"
  kimi-k3-fw:
    label: "Kimi K3 (Fireworks)"
    provider: "fireworks"
    model: "accounts/fireworks/models/kimi-k3"
    extra_body:
      reasoning_effort: "low"
  kimi-k2.6-fw:
    label: "Kimi K2.6 (Fireworks)"
    provider: "fireworks"
    model: "accounts/fireworks/models/kimi-k2p6"
    extra_body:
      reasoning_effort: "none"

  gpt-6-sol:
    label: "GPT-6 Sol"
    provider: "openai"
    model: "gpt-6-sol"
    extra_body:
      reasoning_effort: "none"
  kimi-k3-fast:
    label: "Kimi K3 Fast (Fireworks)"
    provider: "fireworks"
    model: "accounts/fireworks/routers/kimi-k3-fast"
    extra_body:
      reasoning_effort: "none"
  glm-5.3-fast:
    label: "GLM 5.3 Fast (Fireworks)"
    provider: "fireworks"
    model: "accounts/fireworks/routers/glm-5p3-fast"
    extra_body:
      reasoning_effort: "low"
  glm-5.3-prime:
    label: "GLM 5.3 Prime"
    provider: "openrouter"
    model: "z-ai/glm-5.3-prime"
    extra_body:
      reasoning:
        effort: "minimal"
      provider:
        sort: "latency"
        data_collection: "deny"
  glm-5.3-flash-fw:
    label: "GLM 5.3 Flash (Fireworks)"
    provider: "fireworks"
    model: "accounts/fireworks/models/glm-5p3-flash"
    extra_body:
      reasoning_effort: "low"
  ember-1:
    label: "Ember-1 (Fireworks)"
    provider: "fireworks"
    model: "accounts/fireworks/models/ember-1"
    extra_body:
      reasoning_effort: "none"
  glm-5.2-fast:
    label: "GLM 5.2 Fast (Fireworks)"
    provider: "fireworks"
    model: "accounts/fireworks/routers/glm-5p2-fast"
    extra_body:
      reasoning_effort: "none"

prices:
  gpt-6-luna: [0.10, 0.50]
  gpt-6-sol: [2.00, 10.00]
  claude-sonnet-5: [2.00, 10.00]
  claude-opus-5-5: [4.00, 20.00]
  claude-haiku-4-5-20251001: [1.00, 5.00]
  z-ai/glm-5.3: [1.40, 4.40]
  meta/muse-spark-1.3-contributor: [0.10, 0.20]
  qwen/qwen3.8-flash: [0.15, 0.47]
  moonshotai/kimi-k3: [3.00, 15.00]
  google/gemini-3.8-flash: [0.75, 3.75]
  meta/muse-spark-1.3: [1.25, 4.25]
  accounts/fireworks/models/glm-5p3: [1.40, 4.40]
  accounts/fireworks/models/kimi-k3: [3.00, 15.00]
  accounts/fireworks/models/kimi-k2p6: [0.95, 4.00]
  accounts/fireworks/routers/kimi-k3-fast: [4.50, 22.50]
  accounts/fireworks/routers/glm-5p3-fast: [2.10, 6.60]
  z-ai/glm-5.3-prime: [2.80, 8.80]
  accounts/fireworks/models/glm-5p3-flash: [0.15, 0.50]
  accounts/fireworks/models/ember-1: [3.00, 15.00]
  accounts/fireworks/routers/glm-5p2-fast: [2.10, 6.60]
