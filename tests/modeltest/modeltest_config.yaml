attempts: 3
workers: 10
max_retries: 2
narration_max_tokens: 6000
judge_max_tokens: 3000
seed_limit: 400
narration_lang: "English"
baseline: "baseline_gpt-6-luna.json"

providers:
  fireworks:
    type: "openai_compatible"
    api_base: "https://api.fireworks.ai/inference/v1"
    api_key_env: "FIREWORKS_API_KEY"
    timeout_seconds: 120
  openrouter:
    type: "openai_compatible"
    api_base: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    timeout_seconds: 120

judges:
- label: "GPT-6 Sol"
  provider: "openai"
  model: "gpt-6-sol"
  extra_body:
    reasoning_effort: "low"
- label: "Claude Sonnet 5"
  provider: "anthropic"
  model: "claude-sonnet-5"
  extra_body: {}

contestants:
  gpt-6-luna:
    label: "GPT-6 Luna"
    provider: "openai"
    model: "gpt-6-luna"
    extra_body:
      reasoning_effort: "none"
  claude-sonnet-5:
    label: "Claude Sonnet 5"
    provider: "anthropic"
    model: "claude-sonnet-5"
    extra_body: {}
  claude-opus-5-5:
    label: "Claude Opus 5.5"
    provider: "anthropic"
    model: "claude-opus-5-5"
    extra_body:
      output_config:
        effort: "low"
  claude-haiku-4-5:
    label: "Claude Haiku 4.5"
    provider: "anthropic"
    model: "claude-haiku-4-5-20251001"
    extra_body: {}

  glm-5.3:
    label: "GLM 5.3"
    provider: "openrouter"
    model: "z-ai/glm-5.3"
    extra_body:
      reasoning:
        effort: "low"
  muse-spark-1.3:
    label: "Muse Spark 1.3 Contributor"
    provider: "openrouter"
    model: "meta/muse-spark-1.3-contributor"
    extra_body:
      reasoning:
        effort: "low"
  qwen3.8-flash:
    label: "Qwen3.8 Flash"
    provider: "openrouter"
    model: "qwen/qwen3.8-flash"
    extra_body:
      reasoning:
        effort: "low"
  kimi-k3:
    label: "Kimi K3"
    provider: "openrouter"
    model: "moonshotai/kimi-k3"
    extra_body:
      reasoning:
        effort: "low"
  gemini-3.8-flash:
    label: "Gemini 3.8 Flash"
    provider: "openrouter"
    model: "google/gemini-3.8-flash"
    extra_body:
      reasoning:
        effort: "low"

prices:
  gpt-6-luna: [0.10, 0.50]
  gpt-6-sol: [2.00, 10.00]
  claude-sonnet-5: [2.00, 10.00]
  claude-opus-5-5: [4.00, 20.00]
  claude-haiku-4-5-20251001: [1.00, 5.00]
  z-ai/glm-5.3: [1.40, 4.40]
  meta/muse-spark-1.3-contributor: [0.10, 0.20]
  qwen/qwen3.8-flash: [0.15, 0.47]
  moonshotai/kimi-k3: [3.00, 15.00]
  google/gemini-3.8-flash: [0.75, 3.75]
