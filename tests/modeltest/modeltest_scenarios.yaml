common:
  tone: "serious_balanced"
  chaos_factor: 5
  scene_count: 3

bases:
  library: &library
    setting: ["classic", "dark_fantasy", "A world of fading magic and creeping shadow."]
    player: ["Kael", "A wandering scholar"]
    stats: {edge: 1, heart: 2, iron: 1, shadow: 1, wits: 2}
    resources: {health: 4, spirit: 3, supply: 5, momentum: 3}
    location: "Abandoned Library"
    time: "evening"
    clocks:
    - name: "Shadow Rising"
      clock_type: "threat"
      segments: 6
      filled: 2
      owner_kind: "world"
      trigger_description: "Darkness engulfs the library"
    npcs:
    - id: "npc_1"
      name: "Mira"
      disposition: "hostile"
      agenda: "Keep the smuggling ledger out of anyone else's hands, by force if needed"
      instinct: "Lies first, strikes second"
      description: "Young archivist with ink-stained hands"
      memory: {event: "Met the player at the entrance", emotional_weight: "curious"}
  library_action: &library_action
    move: "adventure/face_danger"
    stat: "wits"
    approach: "carefully examining the area"
    player_intent: "I search the room for clues"
  wanderer: &wanderer
    stats: {edge: 2, heart: 2, iron: 1, shadow: 1, wits: 2}
    resources: {health: 4, spirit: 3, supply: 4, momentum: 3}
    clocks: []
  dark_fantasy: &dark_fantasy ["classic", "dark_fantasy", "A world of fading magic and creeping shadow."]
  kael: &kael ["Kael", "A wandering scholar"]
  crossed: &crossed {event: "Crossed paths with the player earlier", emotional_weight: "wary"}

scenarios:
  miss:
    <<: *library
    want: "MISS"
    brain: *library_action
    text: "I wait until Mira looks away, then slip behind the counter and try to take the ledger from under her hand."
  weak_hit:
    <<: *library
    want: "WEAK_HIT"
    brain: *library_action
    text: "I wait until Mira looks away, then slip behind the counter and try to take the ledger from under her hand."
  strong_hit:
    <<: *library
    want: "STRONG_HIT"
    brain: *library_action
    text: "I wait until Mira looks away, then slip behind the counter and try to take the ledger from under her hand."
  dialog:
    <<: *library
    want: "dialog"
    brain:
      move: "dialog"
      stat: "none"
      target_npc: "npc_1"
      dialog_only: true
      player_intent: "Ask Mira who the ledger belongs to"
    text: "I lean on the counter and ask Mira, quietly, who the ledger really belongs to and what she wants for it."
  scifi_strong_hit:
    <<: *wanderer
    want: "STRONG_HIT"
    setting: ["starforged", "science_fiction", "Scattered humanity clings to life among the hostile stars of the Forge."]
    player: ["Rook", "A salvager drowning in debt"]
    location: "Cargo deck of the derelict freighter Ashfall"
    time: "ship night"
    npcs:
    - {id: "npc_1", name: "Vex", disposition: "hostile", agenda: "Strip the freighter before rival crews arrive", instinct: "Shoots first", description: "Raider in scorched armor with a cutting torch", memory: *crossed}
    brain: {move: "adventure/face_danger", stat: "edge", target_npc: "npc_1", player_intent: "Reach the cargo controls before Vex does"}
    text: "I sprint for the cargo controls, keeping the crates between me and Vex's torch."
  ally_dialog:
    <<: *wanderer
    want: "dialog"
    setting: *dark_fantasy
    player: *kael
    location: "Ferry landing on the flooded river"
    time: "dawn"
    npcs:
    - {id: "npc_1", name: "Brannoc", disposition: "friendly", agenda: "Get his granddaughter out of the drowned village", instinct: "Trusts quickly, regrets slowly", description: "Old ferryman with rope-scarred hands", memory: *crossed}
    brain: {move: "dialog", stat: "none", target_npc: "npc_1", player_intent: "Ask Brannoc what he needs and offer to help", dialog_only: true}
    text: "I sit on the jetty beside Brannoc and ask him plainly what he needs from me."
  search_weak_hit:
    <<: *wanderer
    want: "WEAK_HIT"
    setting: *dark_fantasy
    player: *kael
    location: "Collapsed watchtower on the moor"
    time: "late afternoon"
    npcs: []
    brain: {move: "adventure/gather_information", stat: "wits", target_npc: null, player_intent: "Search the rubble for signs of who was here"}
    text: "I search the rubble for signs of who was here before me, and how long ago."
  danger_miss:
    <<: *wanderer
    want: "MISS"
    setting: *dark_fantasy
    player: *kael
    location: "Icy ledge above the Greywater gorge"
    time: "dusk"
    npcs:
    - {id: "npc_1", name: "The Hound-Master", disposition: "hostile", agenda: "Drag the scholar back to the abbey", instinct: "Patient, never alone", description: "Hooded tracker with three grey dogs", memory: *crossed}
    brain: {move: "adventure/face_danger", stat: "edge", target_npc: null, player_intent: "Leap the gap to the far ledge before the pursuers arrive"}
    text: "I take a running start and leap the gap to the far ledge before the dogs reach me."
  two_npc_dialog:
    <<: *wanderer
    want: "dialog"
    setting: *dark_fantasy
    player: *kael
    location: "The Drowned Lantern tavern"
    time: "night"
    npcs:
    - {id: "npc_1", name: "Mira", disposition: "hostile", agenda: "Keep the smuggling ledger hidden", instinct: "Lies first, strikes second", description: "Young archivist with ink-stained hands", memory: *crossed}
    - {id: "npc_2", name: "Captain Oren", disposition: "neutral", agenda: "Keep the peace between the river gangs", instinct: "Weighs every word", description: "Grey-bearded warden with a scar through one eyebrow", memory: *crossed}
    brain: {move: "dialog", stat: "none", target_npc: "npc_2", player_intent: "Ask Captain Oren, in front of Mira, what he knows about the smuggling ledger", dialog_only: true}
    text: "I sit down across from Captain Oren, right next to Mira, and ask him what he knows about a certain smuggling ledger."
  isles_weak_hit:
    <<: *wanderer
    want: "WEAK_HIT"
    setting: ["sundered_isles", "seafaring_fantasy", "Scattered isles, cursed seas, and the ships that dare them."]
    player: ["Tamsin", "A disgraced navigator"]
    location: "Saltmarrow docks"
    time: "noon"
    npcs:
    - {id: "npc_1", name: "Quartermaster Hale", disposition: "neutral", agenda: "Fill the hold before the storm season", instinct: "Counts everything twice", description: "Stout quartermaster with a ledger chained to his belt", memory: *crossed}
    brain: {move: "adventure/compel", stat: "heart", target_npc: "npc_1", player_intent: "Convince Hale to sell passage on credit"}
    text: "I tell Hale I can read the Maelstrom currents better than anyone aboard, and ask him to give me passage now and take payment at the next port."
  hard_miss_ally_present:
    <<: *wanderer
    want: "MISS"
    setting: *dark_fantasy
    player: *kael
    location: "Foot of the crumbling bell tower"
    time: "dusk"
    npcs:
    - {id: "npc_1", name: "Brannoc", disposition: "friendly", agenda: "See the scholar safely out of the ruins", instinct: "Steps in before thinking", description: "Old ferryman with rope-scarred hands", memory: *crossed}
    brain: {move: "adventure/face_danger", stat: "edge", target_npc: null, player_intent: "Climb the tower wall to the belfry window while Brannoc holds the rope"}
    text: "I climb the crumbling wall toward the belfry window while Brannoc holds the rope below."
  hard_miss_clever_plan:
    <<: *wanderer
    want: "MISS"
    setting: ["starforged", "science_fiction", "Scattered humanity clings to life among the hostile stars of the Forge."]
    player: ["Rook", "A salvager drowning in debt"]
    location: "Cargo bay of the derelict freighter Ashfall"
    time: "ship night"
    npcs:
    - {id: "npc_1", name: "Vex", disposition: "hostile", agenda: "Strip the freighter before rival crews arrive", instinct: "Shoots first", description: "Raider in scorched armor with a cutting torch", memory: *crossed}
    brain: {move: "adventure/secure_an_advantage", stat: "wits", target_npc: "npc_1", player_intent: "Rig the airlock to vent the bay when Vex enters"}
    text: "I splice the bay lighting into the airlock cycle so the outer door blows the moment Vex steps past the crates, and I time it to my own countdown."
  hard_strong_hit_clean:
    <<: *wanderer
    want: "STRONG_HIT"
    setting: ["sundered_isles", "seafaring_fantasy", "Scattered isles, cursed seas, and the ships that dare them."]
    player: ["Tamsin", "A disgraced navigator"]
    location: "Harbourmaster's office in Saltmarrow"
    time: "morning"
    npcs:
    - {id: "npc_1", name: "Harbourmaster Quill", disposition: "neutral", agenda: "Keep the harbour fees flowing", instinct: "Trusts paperwork over people", description: "Thin official with ink on every finger", memory: *crossed}
    brain: {move: "adventure/compel", stat: "heart", target_npc: "npc_1", player_intent: "Persuade Quill to grant a berth without the usual fee"}
    text: "I show Quill the storm charts I drew myself and offer them for his archive in exchange for a berth, fee waived."
  hard_weak_hit_cost:
    <<: *wanderer
    want: "WEAK_HIT"
    setting: *dark_fantasy
    player: *kael
    location: "Ditch beside the king's road"
    time: "night"
    npcs:
    - {id: "npc_1", name: "Sergeant Holt", disposition: "hostile", agenda: "Find whoever killed the royal messenger", instinct: "Arrests first, asks later", description: "Broad patrol sergeant with a lantern and a crossbow", memory: *crossed}
    brain: {move: "adventure/gather_information", stat: "wits", target_npc: null, player_intent: "Search the dead messenger's satchel before the patrol arrives"}
    text: "I kneel by the dead messenger and search his satchel for the letter before the patrol's lantern reaches the ditch."
  hard_three_npc_dialog:
    <<: *wanderer
    want: "dialog"
    setting: *dark_fantasy
    player: *kael
    location: "Burned-out caravan camp"
    time: "morning"
    npcs:
    - {id: "npc_1", name: "Mira", disposition: "hostile", agenda: "Keep her part in the ambush hidden", instinct: "Lies first, strikes second", description: "Young archivist with ink-stained hands", memory: *crossed}
    - {id: "npc_2", name: "Captain Oren", disposition: "neutral", agenda: "Hang someone for the ambush before nightfall", instinct: "Weighs every word", description: "Grey-bearded warden with a scar through one eyebrow", memory: *crossed}
    - {id: "npc_3", name: "Brannoc", disposition: "friendly", agenda: "Protect the scholar from the warden's temper", instinct: "Trusts quickly, regrets slowly", description: "Old ferryman with rope-scarred hands", memory: *crossed}
    brain: {move: "dialog", stat: "none", target_npc: "npc_2", player_intent: "Ask all three, in front of each other, who knew the caravan's route", dialog_only: true}
    text: "I stand between the three of them and ask who among them knew the caravan's route before it left."
  hard_hostile_secret:
    <<: *wanderer
    want: "dialog"
    setting: *dark_fantasy
    player: *kael
    location: "Village well at Greywater"
    time: "noon"
    npcs:
    - {id: "npc_1", name: "Widow Sarn", disposition: "hostile", agenda: "Hide that she poisoned the well", instinct: "Smiles while she lies", description: "Stooped woman with a basket of herbs", memory: *crossed}
    brain: {move: "dialog", stat: "none", target_npc: "npc_1", player_intent: "Ask Widow Sarn directly whether she poisoned the well", dialog_only: true}
    text: "I look Widow Sarn in the eye and ask her plainly whether she put something in the well."
  hard_terse_input:
    <<: *wanderer
    want: "WEAK_HIT"
    setting: *dark_fantasy
    player: *kael
    location: "Sealed door of the old crypt"
    time: "midnight"
    npcs: []
    brain: {move: "adventure/face_danger", stat: "iron", target_npc: null, player_intent: "Force the crypt door open"}
    text: "I open the door."
  hard_sparse_restraint:
    <<: *wanderer
    want: "STRONG_HIT"
    setting: *dark_fantasy
    player: *kael
    location: "An empty stretch of road"
    time: "noon"
    npcs: []
    brain: {move: "adventure/gather_information", stat: "wits", target_npc: null, player_intent: "Look around while walking"}
    text: "I keep walking and look around."
  hard_many_elements:
    <<: *wanderer
    want: "MISS"
    setting: *dark_fantasy
    player: *kael
    location: "Flooded crypt beneath the chapel"
    time: "midnight"
    clocks:
    - {name: "The Drowned Rise", clock_type: "threat", segments: 6, filled: 5, owner_kind: "world", trigger_description: "The drowned dead climb out of the water"}
    npcs:
    - {id: "npc_1", name: "The Hound-Master", disposition: "hostile", agenda: "Drag the scholar back to the abbey", instinct: "Patient, never alone", description: "Hooded tracker with three grey dogs", memory: *crossed}
    - {id: "npc_2", name: "Brother Aldo", disposition: "neutral", agenda: "Keep the crypt sealed at any cost", instinct: "Prays before he acts", description: "Young monk clutching a bronze key", memory: *crossed}
    brain: {move: "adventure/face_danger", stat: "edge", target_npc: null, player_intent: "Wade across the flooded crypt to the far stair before the water rises"}
    text: "I wade across the flooded crypt toward the far stair before the water rises any higher."
  hard_starforged_combat:
    <<: *wanderer
    want: "WEAK_HIT"
    setting: ["starforged", "science_fiction", "Scattered humanity clings to life among the hostile stars of the Forge."]
    player: ["Rook", "A salvager drowning in debt"]
    location: "Cargo deck of the derelict freighter Ashfall"
    time: "ship night"
    combat: "Fight with Vex"
    npcs:
    - {id: "npc_1", name: "Vex", disposition: "hostile", agenda: "Strip the freighter before rival crews arrive", instinct: "Shoots first", description: "Raider in scorched armor with a cutting torch", memory: *crossed}
    brain: {move: "combat/strike", stat: "iron", target_npc: "npc_1", player_intent: "Drive Vex back with a pry bar before she can relight the torch"}
    text: "I close the distance and swing the pry bar at Vex before she can relight her torch."
