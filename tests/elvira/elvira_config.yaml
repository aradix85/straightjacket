
username: "elvira"

auto_mode: true

ai:
  provider: "anthropic"
  model: "claude-haiku-5-5"
  temperature: null
  extra_body:
    thinking: {type: "disabled"}

game:
  load_existing: false
  save_name: "autosave"
  setting_id: ""
  player_name: ""
  pronouns: ""
  backstory: ""
  background_vow: ""
  stats: {}
  wishes: ""
  content_lines: ""

session:
  max_chapters: 1
  max_turns: 8
  save_every_n_turns: 5
  save_name_output: "elvira"
  clean_before_run: true
  succession_on_game_over: true
  inject_ai_failure_turn: 3
  scenario: ""

bot_behavior:
  burn_momentum: "auto"
  style: ""

judge:
  enabled: true
  max_tokens: 16000
  extra_body:
    output_config: {effort: "low"}

prices:
  claude-haiku-5-5: [0.10, 0.50]
  claude-sonnet-5-5: [2.00, 10.00]

logging:
  log_file: "elvira_session.json"
  full_debug_log: false
  print_full_narration: true
  print_roll_details: true
  assert_state_invariants: true
  event_prefixes:
  - "[Bonus]"
  - "[Chain]"
  - "[Fact]"
  - "[Fate]"
  - "[Generate]"
  - "[PayThePrice]"
  - "[Metadata]"
  - "[OpeningSetup]"
  - "[Director]"
  - "[Story]"
  - "[Tools]"
  - "[Legacy]"
  - "[Clock]"
  - "[AdventureCrafter]"
  - "[MoveOutcome]"
  - "[FollowUp]"
  - "[Impact]"
  - "[Suffer]"
  - "[Threat]"
  - "[Track]"
  - "[Bond]"
  - "[Move]"

scenarios:
  near_death:
    turns: 8
    style: "aggressor"
    directive: "bot_turn_directive_physical_risk"
    expect: ["follow_up_move", "impact_marked"]
    resources: {health: 0, spirit: 0, supply: 0}
    results: [MISS, MISS, MISS, MISS, MISS, MISS, MISS, MISS]
  succession:
    turns: 2
    expect: ["game_over", "succession"]
    game_over: "death"
  chapter_end:
    turns: 4
    max_chapters: 2
    expect: ["chapter_transition"]
    story_end: true
  momentum_burn:
    turns: 6
    burn_momentum: "always"
    expect: ["burn_offered", "burn_taken"]
    resources: {momentum: "max"}
    results: [MISS, MISS, MISS, MISS, MISS, MISS]
  combat:
    turns: 6
    style: "aggressor"
    directive: "bot_turn_directive_attack"
    expect: ["combat"]
    combat: true
  miss:
    turns: 10
    burn_momentum: "never"
    directive: "bot_turn_directive_investigate"
    expect: ["result:MISS"]
    results: [MISS, MISS, MISS, MISS, MISS, MISS, MISS, MISS, MISS, MISS]
  clock:
    turns: 6
    expect: ["clock_fired"]
    clock_nearly_full: true
    results: [MISS, MISS, MISS, MISS, MISS, MISS]
  complication:
    turns: 10
    directive: "bot_turn_directive_investigate"
    expect: ["complication_clock"]
    results: [WEAK_HIT, WEAK_HIT, WEAK_HIT, WEAK_HIT, WEAK_HIT, WEAK_HIT, WEAK_HIT, WEAK_HIT, WEAK_HIT, WEAK_HIT]
  bond:
    setting: classic
    turns: 6
    directive: "bot_turn_directive_bond"
    expect: ["bond_sealed"]
    companion: true
    results: [STRONG_HIT, STRONG_HIT, STRONG_HIT, STRONG_HIT, STRONG_HIT, STRONG_HIT]
  forsaken_bond:
    setting: classic
    turns: 6
    directive: "bot_turn_directive_companion"
    expect: ["vow_forsaken", "follow_up_move", "bond_tested"]
    companion: true
    bonded: true
    vow_to_companion: true
    threat_on_vow: {origin: pc_negative, menace: full}
  vow_fulfilment:
    turns: 6
    directive: "bot_turn_directive_vow_end"
    expect: ["milestone_reached", "vow_fulfilled"]
    vow_boxes: 7
    results: [STRONG_HIT, STRONG_HIT, STRONG_HIT, STRONG_HIT, STRONG_HIT, STRONG_HIT]
  threat_advance:
    setting: classic
    turns: 6
    style: "aggressor"
    directive: "bot_turn_directive_physical_risk"
    expect: ["threat_advanced"]
    threat_on_vow: {origin: pc_negative, menace: fresh}
    results: [MISS, MISS, MISS, MISS, MISS, MISS]
