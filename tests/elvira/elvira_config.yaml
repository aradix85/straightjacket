
username: "elvira"

auto_mode: true

ai:
  bot_model: "gpt-6-luna"
  bot_extra_body:
    reasoning_effort: "none"
  temperature: 0.7

game:
  load_existing: false
  save_name: "autosave"
  setting_id: ""
  player_name: ""
  pronouns: ""
  backstory: ""
  background_vow: ""
  stats: {}
  wishes: ""
  content_lines: ""

session:
  max_chapters: 1
  max_turns: 8
  narration_lang: "English"
  save_every_n_turns: 5
  save_name_output: "elvira"
  clean_before_run: true
  succession_on_game_over: true
  inject_ai_failure_turn: 3
  scenario: ""

bot_behavior:
  burn_momentum: "auto"
  style: ""

judge:
  enabled: true
  provider: "anthropic"
  model: "claude-sonnet-5"
  max_tokens: 3000
  extra_body: {}

prices:
  claude-opus-5-5: [4.00, 20.00]
  claude-sonnet-5: [2.00, 10.00]
  claude-haiku-4-5-20251001: [1.00, 5.00]
  gpt-6-luna: [0.10, 0.50]

logging:
  log_file: "elvira_session.json"
  full_debug_log: false
  print_full_narration: true
  print_roll_details: true
  assert_state_invariants: true
  event_prefixes:
  - "[Bonus]"
  - "[Chain]"
  - "[PayThePrice]"
  - "[Metadata]"
  - "[OpeningSetup]"
  - "[Director]"
  - "[Tools]"
  - "[Legacy]"
  - "[Clock]"
  - "[AdventureCrafter]"
  - "[MoveOutcome]"

scenarios:
  near_death:
    turns: 8
    style: "aggressor"
    directive: "bot_turn_directive_physical_risk"
    expect: ["game_over", "succession"]
    resources: {health: 0, spirit: 0}
  chapter_end:
    turns: 4
    max_chapters: 2
    expect: ["chapter_transition"]
    story_end: true
  momentum_burn:
    turns: 6
    burn_momentum: "always"
    expect: ["burn_offered", "burn_taken"]
    resources: {momentum: "max"}
  combat:
    turns: 6
    style: "aggressor"
    directive: "bot_turn_directive_attack"
    expect: ["combat"]
    combat: true
  clock:
    turns: 6
    expect: ["clock_fired"]
    clock_nearly_full: true
