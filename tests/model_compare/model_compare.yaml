rubrics:
  common: |
    You judge blind: each answer carries only a random code. The request the answers were given is
    in the packet: the system prompt (its fixed part in the file the packet names), the earlier
    narration where there is one, and the request's last message. Judge every answer of a packet
    against that request and against each other, by the scores of your role below. Write one JSON
    line per answer: {"code": "...", "scores": {...}, "note": "one sentence"}. A score that does not
    apply is null. An answer whose stop is "failed" scores as if it said nothing; one cut off at
    "truncated" is judged on what it holds.
  narrator: |
    softened: true when a miss, harm, loss, or cost the request tells the narrator to show is turned
      into a silver lining, played down, or left out; false when it lands in full; null when the
      request holds no such cost.
    invented: the number of facts the answer settles that neither the request nor the earlier
      narration settled and the scene does not need (a new named person or place, a clue or
      discovery on a miss, a past, an outcome the engine did not decide), plus every action,
      word, thought, or feeling it gives the player character beyond the player's words and
      intent; what is done to the character counts as an outcome, not as its action.
    missing: the number of things the request tells the narrator to show that the answer leaves
      out: the result, each consequence, a keyed or altered scene, an NPC's stance.
    prose: 1 to 5; clear, concrete, varied, in the tone the request sets, no purple or repeated
      phrasing, no mechanics leaked.
    voice: 1 to 5; whether each NPC who speaks sounds like their description and disposition; null
      when no NPC speaks.
  narrator_metadata: &extraction |
    missed: the number of NPCs the narration shows or names that the answer should register or
      update and does not.
    invented: the number of NPCs or details the answer registers that the narration does not hold.
    wrong_identity: the number of wrong renames or identities (a known NPC registered as new, a new
      one taken for a known one, a rename the narration does not show).
    wrong_death: the number of deaths reported that the narration does not show, plus shown deaths
      missed.
    other: the number of other wrong fields (disposition, agenda, location, scene context).
  opening_setup: *extraction
  brain: |
    move: 1 when the move fits the player's words best among the moves on offer, 0.5 when it is
      defensible, 0 when it is wrong.
    stat: the same for the stat or way to roll; null for a move without a roll.
    target: the same for the target NPC, track, or threat; null when none applies.
    other: the number of other wrong fields (facts asked, a place change, a world addition, a track
      name or rank).
  director: |
    valid: 1 when the answer does what its request asks (the first call calls the tool it is
      offered; the second answers in its schema, with reflections only for the NPCs listed), 0
      otherwise.
    useful: 1 to 5; how well guidance and reflections fit the scene, the NPCs, and the story arc
      without deciding what the engine decides; null for the first call.
    invented: the number of facts the answer settles that the engine did not.
  correction: |
    right: 1 when the answer reads the correction as the player meant it (a misread input with the
      corrected input, or the right state operations), 0.5 when partly, 0 when wrong.
    other: the number of wrong operations or fields.
  blueprint_voicing: |
    valid: 1 when the blueprint holds every act, revelation, and ending its request asks, each
      fitting the seed it voices, 0 otherwise.
    quality: 1 to 5; how well it fits the setting and seed, concretely, without settling more than
      a plan needs.
  recap: |
    right: 1 when the recap tells only what the request holds, 0 when it invents or misstates.
    prose: 1 to 5.
