[project]
name = "straightjacket"
version = "2026.11.06.6"
requires-python = ">=3.11"
dependencies = [
    "starlette>=1.0,<2",
    "uvicorn[standard]>=0.34,<1",
    "pyyaml>=6.0,<7",
    "anthropic>=1.8,<2",
    "openai>=3.19,<4",
    "typing-extensions>=4.10,<5",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "pytest-cov", "httpx2", "types-PyYAML", "radon", "ruff==0.17.4", "mypy", "defusedxml", "types-defusedxml"]
elvira = ["websockets>=13.0,<15"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "D",                                          # docstrings are forbidden (CONTRIBUTING.md, Project rules)
    "DOC",                                        # docstrings are forbidden
    "missing-copyright-notice",                   # wants a comment header in every file; comments are forbidden
    "missing-trailing-comma",                     # conflicts with ruff format
    "single-line-implicit-string-concatenation",  # conflicts with ruff format
    "if-else-block-instead-of-dict-get",          # wants dict.get with a fallback; domain config raises on a miss
    "suspicious-non-cryptographic-random-usage",  # the dice use random, and the tests patch random
    # taken up in later releases, one group at a time:
    "any-type",
    "complex-structure",
    "too-many-arguments",
    "too-many-branches",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-return-statements",
    "too-many-statements",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/test_*.py" = ["assert"]
"tests/conftest.py" = ["assert"]
"tests/_*.py" = ["assert"]
"tests/**/*.py" = ["magic-value-comparison"]
"tests/elvira/elvira.py" = ["module-import-not-at-top-of-file"]
"run.py" = [
    "import-outside-top-level",
    "start-process-with-no-shell",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
"tests/test_config_loader.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
"tests/test_project_rules.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
"src/straightjacket/engine/ai/{brain,narrator,recap,blueprint_voicing,provider_base}.py" = ["blind-except"]
"src/straightjacket/engine/{director,correction/analysis}.py" = ["blind-except"]
"src/straightjacket/web/{handlers,server}.py" = ["blind-except"]
"tests/elvira/elvira_bot/{runner,ws_runner,judge}.py" = ["blind-except"]

[tool.ruff.lint.flake8-type-checking]
strict = true
runtime-evaluated-base-classes = ["straightjacket.engine.serialization.SerializableMixin"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["straightjacket"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["src", "stubs"]
files = ["src", "tests", "run.py", "data/data.py"]
explicit_package_bases = true
strict = true
ignore_missing_imports = false
warn_unreachable = true
strict_bytes = true
strict_equality_for_none = true
local_partial_types = true
disallow_any_unimported = true
disallow_any_decorated = true
enable_error_code = [
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "ignore-without-code",
    "unused-awaitable",
    "redundant-self",
    "unused-ignore",
    "explicit-override",
    "unimported-reveal",
    "mutable-override",
    "exhaustive-match",
    "deprecated",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
usefixtures = ["_ruleset_answers", "_no_backoff_wait", "_reset_random"]
asyncio_mode = "strict"

[tool.coverage.run]
source = ["straightjacket"]

[tool.coverage.report]
fail_under = 96
