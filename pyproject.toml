[project]
name = "straightjacket"
version = "2026.11.11.0"
requires-python = ">=3.11"
dependencies = [
    "starlette>=1.0,<2",
    "uvicorn[standard]>=0.34,<1",
    "pyyaml>=6.0,<7",
    "anthropic>=1.8,<2",
    "openai>=3.19,<4",
    "typing-extensions>=4.10,<5",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "pytest-cov", "httpx2", "types-PyYAML", "ruff==0.17.4", "pylint==4.1.3", "mypy", "defusedxml", "types-defusedxml"]
elvira = ["websockets>=13.0,<15"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "D",                                          # docstrings are forbidden (CONTRIBUTING.md, Project rules)
    "DOC",                                        # docstrings are forbidden
    "missing-copyright-notice",                   # wants a comment header in every file; comments are forbidden
    "missing-trailing-comma",                     # conflicts with ruff format
    "single-line-implicit-string-concatenation",  # conflicts with ruff format
    "if-else-block-instead-of-dict-get",          # wants dict.get with a fallback; domain config raises on a miss
    "suspicious-non-cryptographic-random-usage",  # the dice use random, and the tests patch random
    "too-many-arguments",                         # the user's choice: keyword-only arguments name themselves
    # taken up in later releases, one group at a time:
    "any-type",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/test_*.py" = ["assert"]
"tests/conftest.py" = ["assert"]
"tests/_*.py" = ["assert"]
"tests/**/*.py" = ["magic-value-comparison"]
"tests/elvira/elvira.py" = ["module-import-not-at-top-of-file"]
"run.py" = [
    "import-outside-top-level",
    "start-process-with-no-shell",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]
"tests/test_config_loader.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
"tests/_rules_code.py" = ["suspicious-subprocess-import", "subprocess-without-shell-equals-true"]
"src/straightjacket/engine/crafters/config.py" = ["typing-only-first-party-import"]
"src/straightjacket/engine/ai/{brain,narrator,recap,blueprint_voicing,provider_base}.py" = ["blind-except"]
"src/straightjacket/engine/{director,correction/analysis}.py" = ["blind-except"]
"src/straightjacket/web/{handlers,server}.py" = ["blind-except"]
"tests/elvira/elvira_bot/{runner,ws_runner,judge}.py" = ["blind-except"]

[tool.ruff.lint.flake8-type-checking]
strict = true
runtime-evaluated-base-classes = [
    "straightjacket.engine.serialization.SerializableMixin",
    "straightjacket.engine.config_binding.RawSections",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["straightjacket"]

[tool.pylint.main]
py-version = "3.11"
jobs = 0

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",      # docstrings are forbidden (CONTRIBUTING.md, Project rules)
    "missing-class-docstring",       # docstrings are forbidden
    "missing-function-docstring",    # docstrings are forbidden
    "too-many-instance-attributes",  # a dataclass holds one field for each value of the state it models
    "too-few-public-methods",        # dataclasses, protocols, test classes, and fakes hold only what they need
    "unbalanced-tuple-unpacking",    # a test unpacks a list to hold how many entries it has
    "too-many-arguments",            # the user's choice, as in ruff: keyword-only arguments name themselves
    "broad-exception-caught",        # ruff checks it, with the AI-call carve-out
    "import-outside-toplevel",       # ruff checks it, with its carve-out for run.py
    "wrong-import-position",         # ruff checks it, with its carve-out for Elvira's script
    "too-many-locals",               # ruff checks it at the same limit, without arguments, loop and with targets
    "too-many-branches",             # ruff checks it, at the same limit
    "too-many-return-statements",    # ruff checks it, at the same limit
    "too-many-statements",           # ruff checks it, at the same limit
]

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
files = ["src", "tests", "run.py", "data/data.py"]
explicit_package_bases = true
strict = true
ignore_missing_imports = false
warn_unreachable = true
strict_bytes = true
strict_equality_for_none = true
local_partial_types = true
disallow_any_unimported = true
disallow_any_decorated = true
enable_error_code = [
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "ignore-without-code",
    "unused-awaitable",
    "redundant-self",
    "unused-ignore",
    "explicit-override",
    "unimported-reveal",
    "mutable-override",
    "exhaustive-match",
    "deprecated",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
usefixtures = ["_ruleset_answers", "_no_backoff_wait", "_reset_random"]
asyncio_mode = "strict"

[tool.coverage.run]
source = ["straightjacket"]

[tool.coverage.report]
fail_under = 96
