[project]
name = "straightjacket"
version = "2026.11.06.0"
requires-python = ">=3.11"
dependencies = [
    "starlette>=1.0,<2",
    "uvicorn[standard]>=0.34,<1",
    "pyyaml>=6.0,<7",
    "anthropic>=1.8,<2",
    "openai>=3.19,<4",
    "typing-extensions>=4.10,<5",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "pytest-cov", "httpx2", "types-PyYAML", "radon", "ruff", "mypy"]
elvira = ["websockets>=13.0,<15"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM", "UP", "RUF", "PERF", "PT", "PTH", "DTZ"]
ignore = [
    "E501",   # line length — handled by formatter, not linter
    "E402",   # module-level import not at top — tests/conftest.py and tests/elvira/elvira.py set sys.path and the environment first
    "SIM108", # ternary — readability over conciseness in game logic
    "SIM401", # dict.get(k, fallback) — conflicts with the no-fallback rule on domain config
    "PERF401", # manual list comprehension — loops with conditions stay loops when they read clearer
]
per-file-ignores = {"src/straightjacket/engine/game/__init__.py" = ["F401"], "src/straightjacket/engine/tools/__init__.py" = ["F401"], "src/straightjacket/engine/models.py" = ["F401"]}

[tool.ruff.lint.isort]
known-first-party = ["straightjacket"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["src", "stubs"]
files = ["src", "tests", "run.py", "data/data.py"]
explicit_package_bases = true
strict = true
ignore_missing_imports = false
warn_unreachable = true
strict_bytes = true
strict_equality_for_none = true
local_partial_types = true
disallow_any_unimported = true
disallow_any_decorated = true
enable_error_code = [
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "ignore-without-code",
    "unused-awaitable",
    "redundant-self",
    "unused-ignore",
    "explicit-override",
    "unimported-reveal",
    "mutable-override",
    "exhaustive-match",
    "deprecated",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.coverage.run]
source = ["straightjacket"]

[tool.coverage.report]
fail_under = 96
