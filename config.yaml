
server:
  host: "127.0.0.1"
  port: 8081
  stream_narration: true

ai:
  prompts_dir: "prompts"

  providers:
    anthropic:
      type: "anthropic"
      api_base: ""
      api_key_env: "ANTHROPIC_API_KEY"

  clusters:
    narrator:
      provider: anthropic
      model: "claude-opus-5-5"
      temperature: null
      top_p: null
      max_tokens: 8192
      max_retries: 3
      extra_body:
        cache_control:
          type: "ephemeral"
    creative:
      provider: anthropic
      model: "claude-sonnet-5"
      temperature: null
      top_p: null
      max_tokens: 8192
      max_retries: 3
      extra_body:
        cache_control:
          type: "ephemeral"
    classification:
      provider: anthropic
      model: "claude-haiku-4-5-20251001"
      temperature: 0.5
      top_p: null
      max_tokens: 8192
      max_retries: 3
      extra_body:
        cache_control:
          type: "ephemeral"
    judgment:
      provider: anthropic
      model: "claude-haiku-4-5-20251001"
      temperature: 0.5
      top_p: null
      max_tokens: 8192
      max_retries: 3
      extra_body:
        cache_control:
          type: "ephemeral"
    extraction:
      provider: anthropic
      model: "claude-haiku-4-5-20251001"
      temperature: 0.3
      top_p: null
      max_tokens: 8192
      max_retries: 3
      extra_body:
        cache_control:
          type: "ephemeral"

  role_cluster:
    narrator: narrator
    blueprint_voicing: creative
    director: creative
    chapter_summary: creative
    recap: creative
    brain: classification
    correction: classification
    revelation_check: judgment
    narrator_metadata: extraction
    opening_setup: extraction

language:
  narration_language: "English"
