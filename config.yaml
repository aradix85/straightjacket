
server:
  host: "127.0.0.1"
  port: 8081
  stream_narration: true

ai:
  prompts_dir: "prompts"

  providers:
    anthropic:
      type: "anthropic"
      api_base: ""
      api_key_env: "ANTHROPIC_API_KEY"
      timeout_seconds: 120
    openai:
      type: "openai_compatible"
      api_base: ""
      api_key_env: "OPENAI_API_KEY"
      timeout_seconds: 120
    fireworks:
      type: "openai_compatible"
      api_base: "https://api.fireworks.ai/inference/v1"
      api_key_env: "FIREWORKS_API_KEY"
      timeout_seconds: 120

  clusters:
    narrator:
      provider: fireworks
      model: "accounts/fireworks/models/glm-5p3"
      temperature: null
      top_p: null
      max_tokens: 8192
      max_retries: 3
      extra_body:
        reasoning_effort: "low"
    creative:
      provider: fireworks
      model: "accounts/fireworks/models/glm-5p3"
      temperature: null
      top_p: null
      max_tokens: 8192
      max_retries: 3
      extra_body:
        reasoning_effort: "low"
    director:
      provider: fireworks
      model: "accounts/fireworks/models/glm-5p3"
      temperature: null
      top_p: null
      max_tokens: 8192
      max_retries: 3
      extra_body:
        reasoning_effort: "low"
    classification:
      provider: fireworks
      model: "accounts/fireworks/models/glm-5p3"
      temperature: 0.5
      top_p: null
      max_tokens: 8192
      max_retries: 3
      extra_body:
        reasoning_effort: "low"
    judgment:
      provider: fireworks
      model: "accounts/fireworks/models/glm-5p3"
      temperature: 0.5
      top_p: null
      max_tokens: 8192
      max_retries: 3
      extra_body:
        reasoning_effort: "low"
    extraction:
      provider: fireworks
      model: "accounts/fireworks/models/glm-5p3"
      temperature: 0.3
      top_p: null
      max_tokens: 8192
      max_retries: 3
      extra_body:
        reasoning_effort: "low"

  role_cluster:
    narrator: narrator
    blueprint_voicing: creative
    director: director
    chapter_summary: creative
    recap: creative
    brain: classification
    correction: classification
    revelation_check: judgment
    narrator_metadata: extraction
    opening_setup: extraction

language:
  narration_language: "English"
