
server:
  host: "127.0.0.1"
  port: 8081
  stream_narration: true

ai:
  prompts_dir: "prompts"

  providers:
    anthropic:
      type: "anthropic"
      api_base: ""
      api_key_env: "ANTHROPIC_API_KEY"
      timeout_seconds: 120
    openai:
      type: "openai_compatible"
      api_base: ""
      api_key_env: "OPENAI_API_KEY"
      timeout_seconds: 120

  clusters:
    narrator:
      provider: anthropic
      model: "claude-opus-5-5"
      temperature: null
      top_p: null
      max_tokens: 8192
      max_retries: 3
      extra_body:
        cache_control:
          type: "ephemeral"
          ttl: "1h"
        output_config:
          effort: "low"
    creative:
      provider: openai
      model: "gpt-6-luna"
      temperature: null
      top_p: null
      max_tokens: 8192
      max_retries: 3
      extra_body:
        reasoning_effort: "low"
    classification:
      provider: openai
      model: "gpt-6-luna"
      temperature: 0.5
      top_p: null
      max_tokens: 8192
      max_retries: 3
      extra_body:
        reasoning_effort: "none"
    judgment:
      provider: openai
      model: "gpt-6-luna"
      temperature: 0.5
      top_p: null
      max_tokens: 8192
      max_retries: 3
      extra_body:
        reasoning_effort: "none"
    extraction:
      provider: openai
      model: "gpt-6-luna"
      temperature: 0.3
      top_p: null
      max_tokens: 8192
      max_retries: 3
      extra_body:
        reasoning_effort: "none"

  role_cluster:
    narrator: narrator
    blueprint_voicing: creative
    director: creative
    chapter_summary: creative
    recap: creative
    brain: classification
    correction: classification
    revelation_check: judgment
    narrator_metadata: extraction
    opening_setup: extraction

language:
  narration_language: "English"
