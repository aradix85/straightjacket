
server:
  host: "127.0.0.1"
  port: 8081
  stream_narration: true

ai:
  prompts_dir: "prompts"

  providers:
    anthropic:
      type: "anthropic"
      api_base: ""
      api_key_env: "ANTHROPIC_API_KEY"
      timeout_seconds: 120
    openai:
      type: "openai_compatible"
      api_base: ""
      api_key_env: "OPENAI_API_KEY"
      timeout_seconds: 120
    fireworks:
      type: "openai_compatible"
      api_base: "https://api.fireworks.ai/inference/v1"
      api_key_env: "FIREWORKS_API_KEY"
      timeout_seconds: 120
    openrouter:
      type: "openai_compatible"
      api_base: "https://openrouter.ai/api/v1"
      api_key_env: "OPENROUTER_API_KEY"
      timeout_seconds: 120
    together:
      type: "openai_compatible"
      api_base: "https://api.together.xyz/v1"
      api_key_env: "TOGETHER_API_KEY"
      timeout_seconds: 120

  clusters:
    narrator:
      provider: anthropic
      model: "claude-haiku-5-5"
      temperature: null
      top_p: null
      max_tokens: 16000
      max_retries: 3
      extra_body:
        output_config: {effort: "medium"}
        cache_control: {type: "ephemeral", ttl: "1h"}
    creative:
      provider: anthropic
      model: "claude-haiku-5-5"
      temperature: null
      top_p: null
      max_tokens: 16000
      max_retries: 3
      extra_body:
        output_config: {effort: "medium"}
        cache_control: {type: "ephemeral", ttl: "1h"}
    director:
      provider: anthropic
      model: "claude-haiku-5-5"
      temperature: null
      top_p: null
      max_tokens: 16000
      max_retries: 3
      extra_body:
        output_config: {effort: "medium"}
        cache_control: {type: "ephemeral", ttl: "1h"}
    classification:
      provider: anthropic
      model: "claude-haiku-5-5"
      temperature: null
      top_p: null
      max_tokens: 8192
      max_retries: 3
      extra_body:
        output_config: {effort: "medium"}
        cache_control: {type: "ephemeral", ttl: "1h"}
    judgment:
      provider: anthropic
      model: "claude-haiku-5-5"
      temperature: null
      top_p: null
      max_tokens: 8192
      max_retries: 3
      extra_body:
        output_config: {effort: "medium"}
        cache_control: {type: "ephemeral", ttl: "1h"}
    extraction:
      provider: anthropic
      model: "claude-haiku-5-5"
      temperature: null
      top_p: null
      max_tokens: 8192
      max_retries: 3
      extra_body:
        output_config: {effort: "medium"}
        cache_control: {type: "ephemeral", ttl: "1h"}

  role_cluster:
    narrator: narrator
    blueprint_voicing: creative
    director: director
    recap: creative
    brain: classification
    correction: classification
    revelation_check: judgment
    narrator_metadata: extraction
    opening_setup: extraction

language:
  narration_language: "English"
