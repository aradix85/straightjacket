
server:
  host: "127.0.0.1"
  port: 8081
  stream_narration: true

ai:
  prompts_dir: "prompts"

  providers:
    anthropic:
      type: "anthropic"
      api_base: ""
      api_key_env: "ANTHROPIC_API_KEY"
      timeout_seconds: 120

  clusters:
    narrator:
      provider: anthropic
      model: "claude-fable-5-2"
      temperature: null
      top_p: null
      max_tokens: 16000
      max_retries: 3
      extra_body:
        output_config: {effort: "medium"}
        cache_control: {type: "ephemeral", ttl: "1h"}
        speed: "fast"
    creative:
      provider: anthropic
      model: "claude-opus-5-5"
      temperature: null
      top_p: null
      max_tokens: 16000
      max_retries: 3
      extra_body:
        output_config: {effort: "medium"}
        cache_control: {type: "ephemeral", ttl: "1h"}
        speed: "fast"
    director:
      provider: anthropic
      model: "claude-fable-5-2"
      temperature: null
      top_p: null
      max_tokens: 16000
      max_retries: 3
      extra_body:
        output_config: {effort: "medium"}
        cache_control: {type: "ephemeral", ttl: "1h"}
        speed: "fast"
    classification:
      provider: anthropic
      model: "claude-fable-5-2"
      temperature: null
      top_p: null
      max_tokens: 8192
      max_retries: 3
      extra_body:
        output_config: {effort: "medium"}
        cache_control: {type: "ephemeral", ttl: "1h"}
        speed: "fast"
    extraction:
      provider: anthropic
      model: "claude-fable-5-2"
      temperature: null
      top_p: null
      max_tokens: 8192
      max_retries: 3
      extra_body:
        output_config: {effort: "medium"}
        cache_control: {type: "ephemeral", ttl: "1h"}
        speed: "fast"

  role_cluster:
    narrator: narrator
    blueprint_voicing: creative
    director: director
    recap: creative
    brain: classification
    correction: classification
    narrator_metadata: extraction
    opening_setup: extraction

language:
  narration_language: "English"
