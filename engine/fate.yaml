fate:
  default_method: fate_chart
  likelihood_rules:
    disposition_scores:
      hostile: -3
      distrustful: -2
      neutral: 0
      friendly: 2
      loyal: 3
    score_to_odds:
    - min_score: 5
      odds: certain
    - min_score: 4
      odds: nearly_certain
    - min_score: 3
      odds: very_likely
    - min_score: 1
      odds: likely
    - min_score: -1
      odds: fifty_fifty
    - min_score: -3
      odds: unlikely
    - min_score: -4
      odds: very_unlikely
    - min_score: -5
      odds: nearly_impossible
    - min_score: -99
      odds: impossible
