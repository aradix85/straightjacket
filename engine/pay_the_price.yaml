pay_the_price:
  oracle_path: moves/pay_the_price
  max_rerolls: 2
  reroll_rows:
  - prefix: Roll twice
    extra_rolls: 2
  - prefix: Roll again
    extra_rolls: 1
  suffer_rows:
  - prefix: You are harmed
    effect: health -1
  - prefix: It is harmful
    effect: health -1
  - prefix: You are stressed
    effect: spirit -1
  - prefix: It is stressful
    effect: spirit -1
  - prefix: You waste resources
    effect: supply -1
  - prefix: It wastes resources
    effect: supply -1
