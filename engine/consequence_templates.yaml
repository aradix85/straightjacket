consequence_templates:
  health_light:
  - '{player} takes a hit — bruised ribs, split skin, something that slows them down.'
  - The impact catches {player} in the side. Blood wells through torn fabric.
  - Pain flares where the blow landed. {player} staggers, favoring one leg.
  health_heavy:
  - '{player} crumples. Something is broken, bone or cartilage.'
  - Blood runs freely from {player}'s wound and will not stop on its own.
  - '{player} goes down hard. Getting up takes too long and costs too much.'
  spirit_light:
  - '{player}''s hands lose their steadiness for a moment.'
  - '{player}''s breathing turns heavy, and their movements slow.'
  - Exhaustion drags at {player}; every motion takes more effort than it should.
  spirit_heavy:
  - '{player}''s hands shake and will not stop.'
  - '{player} goes still for a long moment, jaw locked tight.'
  - '{player}''s composure cracks: voice tight, breathing ragged.'
  supply_any:
  - '{player} loses gear from the pack: dropped, broken, or spent.'
  - Supplies run low; {player}'s pack holds less than it did.
  - Something essential is gone from {player}'s kit.
  momentum_loss:
  - Whatever advantage {player} had slips away.
  - The situation turns against {player}. Ground lost.
  - The footing slips out from under {player}. Whatever edge there was, it's gone.
  health_gain:
  - '{player} catches their breath. The worst pain recedes.'
  - '{player} steadies. Wounded, but functional.'
  - The pain ebbs to something {player} can carry.
  spirit_gain:
  - '{player}''s breathing evens out. Enough to keep moving.'
  - '{player}''s hands are steady again.'
  - The tightness goes out of {player}'s shoulders.
  supply_gain:
  - '{player}''s essentials are restocked.'
  - '{player}''s pack is heavier now: useful weight, the kind that buys time.'
  - '{player}''s kit is whole again.'
  bond_gain:
  - '{npc} meets {player}''s gaze and holds it. Trust, earned.'
  - '{npc} settles closer to {player}: the small distance that says belief.'
  - Something in {npc}'s posture eases toward {player}. The wall is lower now.
  disposition_shift:
  - '{npc} looks at {player} differently now, a shade warmer than before.'
  - '{npc}''s guard toward {player} drops a notch.'
  - Whatever {npc} thought of {player}, it has shifted, and for the better.
  momentum_gain:
  - An opening appears, and it favours {player}.
  - The situation tilts toward {player}.
  - Ground tilts toward {player}. The fight, the room, the moment lean their way now.
  - The edge passes to {player}.
  complication_gather_information:
  - What {player} learns also complicates the quest or brings a new danger into view.
  - The answer comes with a catch that makes the way ahead harder for {player}.
  complication_compel:
  - The agreement comes with a demand, something {player} must give or do in return.
  - They agree, but on a condition {player} will have to meet.
  complication_make_a_connection:
  - The connection is made, but it comes with a complication or cost, something they reveal or demand of {player}.
  - '{player} gains the connection, and with it a cost: something they reveal, or something they ask in return.'
  bond_sealed:
  - '{player} and {npc} now share a bond.'
  - 'A bond holds now between {player} and {npc}.'
  bond_cleared:
  - The bond between {player} and {npc} breaks.
  - What held {player} and {npc} together is gone now.
  obstacle:
  - A significant obstacle stands in the way before {player} can begin the quest, and {player} must overcome it first.
  - The quest cannot begin yet; something stands in {player}'s way that must be overcome first.
  bond_tested:
  - '{player} meets {npc} again after forsaking the vow made to them, and the bond between them is put to the test.'
  - 'The forsaken vow stands between {player} and {npc} now, and it tests the bond they share.'
  loyalty_test:
  - The bond is fragile, and they ask {player} to prove loyalty, something {player} has yet to do for them.
  - The bond holds for now, but they want proof of {player}'s loyalty first.
  bond_request:
  - The bond is sealed, but they ask something more of {player} first, a request still to be met.
  - They accept the bond on one condition, something {player} has yet to do for them.
  recommit:
  - '{player} does not give up on it: {danger}. The way is longer now and harder.'
  - 'The setback costs ground, but {player} takes it up again: {danger}, now harder than before.'
  complication_clock:
  - 'The first sign of a new danger shows, small for now: {danger}. Left alone, it will grow.'
  - 'Something starts that will not stop by itself: {danger}. For now it is only a sign.'
  complication_averted:
  - '{player} heads off the danger before it strikes: {danger}.'
  - 'The danger is stopped in time, by {player}''s hand: {danger}.'
  clock_tick:
  - Time passes. The threat advances.
  - The deadline moves closer whether {player} is ready or not.
  clock_triggered:
  - 'Time''s up. {clock}: {trigger}.'
  impact_mark:
  - '{player} carries a lasting mark of this: {impact}.'
  - This leaves {player} {impact}, the kind of wound that stays.
  - '{player} is now {impact}. The cost of this moment won''t fade with rest.'
  impact_clear:
  - The weight of being {impact} lifts from {player}.
  - '{player} is no longer {impact}.'
  - '{impact} no longer marks {player}. Something has healed.'
