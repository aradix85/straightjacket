random_events:
  threat_target_probability: 0.5
  description_focus_categories:
  - ambiguous_event
  npc_focus_categories:
  - npc_action
  - npc_negative
  - npc_positive
  - new_npc
  thread_focus_categories:
  - move_toward_thread
  - move_away_from_thread
  - close_thread
  threat_eligible_focus_categories:
  - pc_negative
  - move_away_from_thread
  list_weight_max: 3
  consolidation_threshold: 25
  consolidation_weight_high: 3
  consolidation_weight_low: 2
  consolidation_weight_default: 1

  keyed_scene_mapping:
    npc_action:
      trigger_type: bond_threshold
      threshold: 4
      priority: 5
      narrative_hint: "An NPC acts on their own initiative, in a way the player will need to react to."
    npc_positive:
      trigger_type: bond_threshold
      threshold: 5
      priority: 4
      narrative_hint: "An NPC's actions land in the player's favour at a moment when it matters."
    npc_negative:
      trigger_type: bond_threshold
      threshold: 4
      priority: 6
      narrative_hint: "An NPC turns against the player or their interests."
    pc_negative:
      trigger_type: threat_menace_phase
      threshold: 3
      priority: 7
      narrative_hint: "Pressure on the player from an active threat sharpens into a confrontation."

  threat_creation_mapping:
    pc_negative:
      rank: dangerous
      category: emergent
    npc_negative:
      rank: troublesome
      category: emergent
