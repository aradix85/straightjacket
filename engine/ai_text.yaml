ai_text:
  schema_titles:
    brain_output: brain_output
    director_output: director_output
    blueprint_voicing_output: blueprint_voicing_output
    narrator_metadata: narrator_metadata
    opening_setup: opening_setup
    correction_output: correction_output
    revelation_check: revelation_check
  brain_trigger_hints:
    dialog: pure conversation with an NPC, without risk, action, or claims about the world
    ask_the_oracle: a yes/no or open question about the fiction instead of an action
    world_shaping: the player declares a new fact about the world ('there is a well', 'the door has a lock', 'I say there's
      a market nearby'), telling the fiction what exists. It is not dialog, since no NPC is addressed, and not a question,
      which is ask_the_oracle.
    adventure/face_danger: an attempt at something risky, or a reaction to an immediate threat, right now; preparing and
      investigating are other moves
    adventure/gather_information: searching for clues, investigating, studying, researching, or analyzing evidence, to
      learn something unknown; gaining a tactical edge is secure_an_advantage
    adventure/secure_an_advantage: preparing, positioning, setting up, hiding, or scouting ahead before acting, to gain a
      tactical edge for the next action; learning something new is gather_information
  schema_descriptions:
    revelation_check:
      revelation_confirmed: True if the narration clearly contains or foreshadows the revelation.
      reasoning: One sentence explaining why.
  consequence_labels:
    momentum_change: momentum {value}
    track_gain: '{track} +{n}'
    track_loss: '{track} -{n}'
    integrity_change: integrity {value}
    mark_progress: mark progress ×{n}
    next_move_bonus: next move +{n}
    chained_move: 'follow-up move {move}: {result}'
    connection_rank: '{name} connection rank now {rank}'
    legacy_reward: legacy reward ({track})
    experience_reward: mark experience
    clock_fill: clock +{n}
    complication: complication {kind}
    complication_clock: complication_clock {name}
    complication_averted: complication_averted {name}
    bond_progress: '{name} bond progress +{n} ticks'
    disposition_shift: '{name} disposition {old}→{new}'
    mark_impact: mark {impact}
    clear_impact: clear {impact}
    threshold_vow: swear a deathbound vow
  narrator_defaults:
    unknown_location: unknown
    unknown_time: unspecified
    unknown_intent: general
    no_npcs: (none)
    no_npcs_yet: none yet
    no_npcs_nearby: no one nearby
    no_roll: dialog (no roll)
    npc_appeared_event: '{npc_name} appeared'
    recap_fallback: ({player_name} recalls the recent events...)
    new_chapter_threads_template: 'New chapter. Open threads: {threads}'
    new_chapter_blank: A new chapter begins.
    aftermath_act_title: Aftermath
    aftermath_act_goal: Open-ended play
    npc_agency_action_template: '{npc_name} acts on their agenda ("{agenda}") somewhere off screen; show an effect of it
      that reaches this scene: a sign, a rumour, or a consequence.'
    momentum_burn_injection: <momentum_burn>The player spent momentum to turn the result; the result in the scene already
      counts it. Show the turn through the player character's effort.</momentum_burn>
