position_resolver:
  desperate_below: -3
  controlled_above: 3
  npc_bond_high_min: 3
  npc_bond_low_max: 0
  strain_weights:
    critical: -2
    low: -1
    steady: 0
  disposition_weights:
    hostile: -2
    distrustful: -1
    neutral: 0
    friendly: 1
    loyal: 2
  weights:
    npc_bond_high: 1
    npc_bond_low: -1
    chaos_high: -1
    chaos_low: 1
    consecutive_failures: -2
    consecutive_successes: 1
    threat_clock_critical: -1
    secured_advantage: 2
  move_baselines:
    combat: -1
    social: 0
    gather_information: 0
    endure: 0
    recovery: 1
    other: 0
  overrides:
  - name: setup_under_pressure
    conditions:
    - secured_advantage
    - any_strain_critical
    effect: cap_at_risky
  - name: crisis_recovery
    conditions:
    - crisis_mode
    - recovery_move
    effect: floor_at_risky
