memory:
  min_token_length: 3
  consolidation_floor: 3
  unknown_emotion_importance: 4
  overlap_scale: 2
  relevance_min_context_words: 3
  importance_max: 10
  emotion_split_pattern: '[_/,;:\s]+|(?:\s+and\s+)|(?:\s+mixed\s+with\s+)'
memory_emotions:
  base:
    combat_failure: fear_pain
    combat_partial: tense_relief
    combat_success: fierce_triumph
    social_failure: suspicious_resentful
    social_partial: guarded_cautious
    social_success: trusting_open
    endure_failure: desperate_suffering
    endure_partial: grim_endurance
    endure_success: relieved
    recovery_failure: desperate_frustrated
    recovery_partial: grateful
    recovery_success: grateful_relieved
    other_failure: frustrated_setback
    other_partial: wary_uncertain
    other_success: confident
    gather_information_failure: confused_misled
    gather_information_partial: cautiously_informed
    gather_information_success: enlightened
    dialog: neutral
  disposition_suffix:
    hostile: _hostile
    distrustful: _wary
    neutral: ''
    friendly: _warm
    loyal: _devoted
memory_templates:
  action: 'scene {scene}: {player} {move_verb} — {result_text}'
  action_targeted: 'scene {scene}: {player} {move_verb} involving {npc} — {result_text}'
  dialog: 'scene {scene}: {player} spoke with {npc} about {intent}'
  dialog_no_target: 'scene {scene}: {player} engaged in conversation — {intent}'
memory_result_text:
  combat_failure: it went badly, the situation worsened
  combat_partial: managed but took damage in the process
  combat_success: struck true and gained the upper hand
  social_failure: was rebuffed, trust eroded
  social_partial: got somewhere but it came at a cost
  social_success: connected and made real progress
  endure_failure: buckled under the strain
  endure_partial: held on, barely
  endure_success: endured and came through
  recovery_failure: the attempt to recover failed
  recovery_partial: recovered somewhat
  recovery_success: recovered well
  other_failure: failed and the situation deteriorated
  other_partial: partial success with complications
  other_success: succeeded cleanly
  gather_information_failure: learned nothing useful, or worse, was misled
  gather_information_partial: pieced together partial information
  gather_information_success: uncovered what was needed
  dialog: exchanged words
memory_retrieval_weights:
  recency: 0.4
  importance: 0.35
  relevance: 0.25
